name: probe
on:
  push:
    branches: ["arena/c1306650-222"]
    paths: ["probe/**", ".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run commands on instance via PTY
        run: |
          mkdir -p ~/.ssh
          ssh-keygen -t ed25519 -N '' -f ~/.ssh/id_ed25519
          python3 probe/drive.py || true
          # strip ANSI escapes and CR for readability
          sed -e 's/\x1b\[[0-9;?]*[a-zA-Z]//g' -e 's/\r//g' /tmp/out.txt > /tmp/out_clean.txt || true
      - name: Save output to repo
        if: always()
        run: |
          mkdir -p probe-out
          cp /tmp/out_clean.txt probe-out/out.txt 2>/dev/null || echo "no output" > probe-out/out.txt
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add probe-out/out.txt
          git commit -m "instance output [skip ci]" || exit 0
          git push origin HEAD:arena/c1306650-222
