name: probe
on:
  push:
    branches: ["arena/c1306650-222"]
    paths: ["probe/**", ".github/workflows/probe.yml"]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run commands on instance via PTY
        run: |
          mkdir -p ~/.ssh
          ssh-keygen -t ed25519 -N '' -f ~/.ssh/id_ed25519
          set +e
          {
            sudo apt-get update -qq && sudo apt-get install -y -qq binutils-riscv64-linux-gnu
            echo "apt rc=$?"
            which riscv64-linux-gnu-as riscv64-linux-gnu-ld
            riscv64-linux-gnu-as -march=rv64gcv -o /tmp/exp.o probe/exp.s
            echo "as rc=$?"
            riscv64-linux-gnu-ld -o /tmp/exp /tmp/exp.o
            echo "ld rc=$?"
            ls -l /tmp/exp
          } > /tmp/build.log 2>&1
          python3 probe/drive2.py /tmp/exp || true
          # strip ANSI escapes and CR for readability
          sed -e 's/\x1b\[[0-9;?]*[a-zA-Z]//g' -e 's/\r//g' /tmp/out.txt > /tmp/out_clean.txt || true
      - name: Save output to repo
        if: always()
        run: |
          mkdir -p probe-out
          cp /tmp/out_clean.txt probe-out/out.txt 2>/dev/null || echo "no output" > probe-out/out.txt
          cp /tmp/out.txt probe-out/raw.bin 2>/dev/null || true
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add probe-out/out.txt probe-out/raw.bin
          git commit -m "instance output [skip ci]" || exit 0
          git push origin HEAD:arena/c1306650-222
