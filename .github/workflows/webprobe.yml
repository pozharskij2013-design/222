name: webprobe
on:
  push:
    branches: ["arena/c1306650-222"]
    paths: ["webprobe/**", ".github/workflows/webprobe.yml"]
permissions:
  contents: write
jobs:
  webprobe:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Probe web instance
        run: |
          set +e
          mkdir -p /tmp/web-out
          python3 -m pip install -q Flask >/tmp/pip.log 2>&1 || true
          python3 -u webprobe/probe3.py 2>&1 | tee /tmp/web-out/RUN.log
          cp /tmp/pip.log /tmp/web-out/PIP.log || true
      - name: Save web probe output
        if: always()
        run: |
          rm -rf web-out
          mkdir -p web-out
          cp -a /tmp/web-out/. web-out/ 2>/dev/null || true
          git config user.email "actions@github.com"
          git config user.name "github-actions"
          git add -A web-out/
          git commit -m "web probe output [skip ci]" || exit 0
          git push origin HEAD:arena/c1306650-222
